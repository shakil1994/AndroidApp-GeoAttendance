name: camera_sync
description: Advanced camera and offline upload sync assessment.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Camera
  camera: ^0.11.0+2

  # State management
  flutter_bloc: ^8.1.6

  # Local database
  sqflite: ^2.4.1

  # File paths
  path: ^1.9.0

  path_provider: ^2.1.2

  # Connectivity
  connectivity_plus: ^6.1.2

  # Background jobs
  workmanager: ^0.6.0

  # HTTP
  http: ^1.2.2

  # Immutable/simple utilities
  equatable: ^2.0.7

  cupertino_icons: ^1.0.8

  change_app_package_name: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true